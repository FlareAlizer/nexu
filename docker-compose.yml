# Прод на VPS (Spaceweb): caddy (HTTPS + статика фронта) + api + postgres.
# Секреты — в .env рядом с этим файлом на сервере.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-dist:/srv/www:ro # собранный фронт (vite build)
      - caddy_data:/data
    depends_on: [api]

  api:
    image: ghcr.io/flarealizer/nexu-backend:latest # собирается в CI (.github/workflows/deploy.yml)
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexu:${POSTGRES_PASSWORD}@db:5432/nexu
    depends_on: [db]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexu
      POSTGRES_DB: nexu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  caddy_data:
